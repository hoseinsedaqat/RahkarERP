# تنظیماتِ انتشار روی Netlify
# ---------------------------------------------------------------------
# برنامه یک اپِ ایستا با مسیریابیِ hash است؛ همه‌ی مسیرهای واقعی روی ریشه
# (مثلاً /#modules/accounting) هستند. پس هر نشانیِ دیگری واقعاً «پیدا نشد»
# است و باید صفحه‌ی اختصاصیِ ۴۰۴ را با کدِ واقعیِ ۴۰۴ بگیرد — نه صفحه‌ی
# پیش‌فرضِ خودِ Netlify.
#
# فایلِ dist/404.html هنگامِ ساخت توسطِ اسکریپتِ postbuild (scripts/prepare-pages.mjs)
# ساخته می‌شود؛ بدونِ آن، Netlify چیزی برای فرستادن ندارد.

[build]
  command = "npm run build"
  publish = "dist"

# نشانی‌های ناشناس → صفحه‌ی اختصاصیِ ۴۰۴.
# این قاعده فایل‌های موجود را پنهان نمی‌کند؛ فقط وقتی اجرا می‌شود که هیچ
# فایلی با نشانیِ درخواست‌شده نخورد.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# سرویس‌ورکر هرگز کش نشود تا پس از هر انتشار، نسخه‌ی تازه فوراً فعال شود.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
